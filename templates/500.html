{% extends "base.html" %}
{% block title %}Server Error – Niduka Thennakoon{% endblock %}
{% block content %}
<section class="error-page section" aria-label="Server error">
  <div class="container" style="text-align:center; padding-block: 6rem;">
    <p style="font-size:5rem; line-height:1;">⚙️</p>
    <h1 style="font-size:clamp(2rem,6vw,4rem); margin-block:.5rem 1rem;">500 – Something Went Wrong</h1>
    <p style="color:var(--text-secondary); max-width:520px; margin-inline:auto; margin-bottom:2rem;">
      An unexpected error occurred on the server. Please try again in a moment,
      or reach out at
      <a href="mailto:{{ site.contact.email }}" style="color:var(--accent);">{{ site.contact.email }}</a>.
    </p>
    <a href="{{ url_for('index') }}" class="btn btn-primary">← Back to Home</a>
  </div>
</section>
{% endblock %}
